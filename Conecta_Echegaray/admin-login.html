<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración | Conecta Echegaray</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="section">
    <div class="form-container" style="max-width: 460px; margin: 4rem auto;">
      <span class="eyebrow">ADMINISTRACIÓN</span>
      <h1>Panel de revisión</h1>
      <p>Inicia sesión con tu cuenta de administrador.</p>
      <form id="adminLoginForm">
        <div class="form-group"><label for="email">Correo</label><input id="email" type="email" required autocomplete="username"></div>
        <div class="form-group"><label for="password">Contraseña</label><input id="password" type="password" required autocomplete="current-password"></div>
        <p id="loginMessage" role="alert"></p>
        <button class="btn btn-primary" type="submit">Entrar al panel</button>
      </form>
    </div>
  </main>
  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const message = document.getElementById('loginMessage');
      message.textContent = '';
      const response = await fetch('/api/auth/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('password').value})});
      if (response.ok) { window.location.assign('/revision.html'); return; }
      const data = await response.json().catch(() => ({}));
      message.textContent = data.detail || 'No fue posible iniciar sesión.';
      message.className = 'form-error';
    });
  </script>
</body>
</html>
